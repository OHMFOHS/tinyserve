[project]
name = "tinyserve"
version = "0.1.0"
description = "A from-scratch LLM inference engine with hand-written CUDA kernels"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "transformers", "safetensors", "huggingface_hub", "fastapi", "uvicorn", "httpx", "tqdm", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["tinyserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
